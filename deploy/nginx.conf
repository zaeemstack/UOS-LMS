# ==============================================================================
# University of Sahiwal (UOS) Attendance Management System
# Production Nginx Reverse Proxy Configuration with HTTPS & Real-IP Preservation
# ==============================================================================

# Rate limiting zone for API requests
limit_req_zone $binary_remote_addr zone=uos_api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name attendance.uosahiwal.edu.pk;

    # Automatically redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name attendance.uosahiwal.edu.pk;

    # SSL Certificate Paths (Managed by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/attendance.uosahiwal.edu.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.uosahiwal.edu.pk/privkey.pem;

    # Modern SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Maximum file upload size (supports bulk timetable PDFs and CSV rosters)
    client_max_body_size 25M;

    # 1. Frontend Static Files (Built Vite distribution in dist/)
    root /var/www/uos-attendance/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Cache immutable Vite assets (hashes in filename)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. Backend API Proxy (Port 5000)
    # CRITICAL: Preserves true campus client IP so ipFenceMiddleware can verify perimeter!
    location /api/ {
        limit_req zone=uos_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. WebSocket Real-time Gateway (/socket.io/)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
